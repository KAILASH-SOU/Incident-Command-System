version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - sentinel_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - sentinel_network

networks:
  sentinel_network:
    driver: bridge
