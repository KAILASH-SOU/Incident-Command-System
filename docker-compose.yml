version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - sentinel_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    networks:
      - sentinel_network
    depends_on:
      - backend

networks:
  sentinel_network:
    driver: bridge